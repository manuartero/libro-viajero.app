# Run from the repo root: docker compose -f e2e/docker-compose.yml run --rm tests
services:
  tests:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
      args:
        PW_VERSION: "1.63.0"
    ipc: host # Chromium shares memory via /dev/shm; without this it OOMs
    environment:
      CI: "1"
      BASE_URL: http://localhost:5173
    volumes:
      # Results, reports and snapshot baselines come back to the host.
      - ./test-results:/work/e2e/test-results
      - ./playwright-report:/work/e2e/playwright-report
      - ./app:/work/e2e/app # *.spec.ts-snapshots/ live beside the specs
