name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    name: release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - id: bump
        run: |
          version=$(npm version "$BUMP" --no-git-tag-version)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          .github/scripts/changelog.sh "$(git describe --tags --abbrev=0)" "$VERSION" > "$RUNNER_TEMP/section.md"
          {
            echo "# Changelog"
            echo
            cat "$RUNNER_TEMP/section.md"
            tail -n +2 CHANGELOG.md
          } > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

      # Merging this PR is what ships: deploy.yml tags the version once the
      # deploy is green.
      - env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): v$VERSION"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/section.md"; then
            echo "Branch pushed, but the PR could not be opened (is \"Allow GitHub Actions to create and approve pull requests\" on?). [Open it by hand]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
